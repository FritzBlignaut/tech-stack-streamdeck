name: CI / Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # ── Job 1: Run the test suite ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  # ── Job 2: Build the Electron app (only after tests pass) ─────────────────
  build:
    name: Build (Linux)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # node-hid needs libudev; sharp needs its own native libs
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Install Node dependencies
        run: npm ci

      # Rebuild native modules (node-hid, sharp) against the bundled Electron
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild
        env:
          npm_config_build_from_source: true

      - name: Build renderer (Vite) + package Electron app
        run: npm run electron:build
        env:
          # Allows electron-builder to publish/download if needed
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload .AppImage so it can be downloaded from the Actions run page
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Stack-Stream-Deck-linux-x64.AppImage
          path: dist-electron/*.AppImage
          if-no-files-found: error
          retention-days: 30

      # Upload .deb for Debian/Ubuntu users
      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Stack-Stream-Deck-linux-x64.deb
          path: dist-electron/*.deb
          if-no-files-found: error
          retention-days: 30
