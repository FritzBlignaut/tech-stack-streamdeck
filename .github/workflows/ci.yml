name: CI / Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # ── Job 1: Run the test suite ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  # ── Job 2: Build the Electron app (only after tests pass) ─────────────────
  build:
    name: Build (Linux)
    needs: test
    # ubuntu-22.04 ships g++ 11 which can compile node-hid's native module.
    # ubuntu-24.04 (ubuntu-latest) uses g++ 13/14 which breaks node-hid's
    # vendored node-addon-api due to a TypedThreadSafeFunction template syntax
    # incompatibility.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # node-hid needs libudev; node-hid's vendored node-addon-api fails to
      # compile on g++≥12 (TypedThreadSafeFunction template syntax regression).
      # Explicitly install and pin to g++-11, which ships in ubuntu-22.04.
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev gcc-11 g++-11

      - name: Install Node dependencies
        run: npm ci

      # electron-builder invokes @electron/rebuild internally when packaging,
      # so no separate rebuild step is needed here.
      # CC/CXX are passed so node-gyp (used to compile node-hid) uses g++-11.
      - name: Build renderer (Vite) + package Electron app
        run: npm run electron:build
        env:
          CC: gcc-11
          CXX: g++-11
          # Allows electron-builder to publish/download if needed
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload .AppImage so it can be downloaded from the Actions run page
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Stack-Stream-Deck-linux-x64.AppImage
          path: dist-electron/*.AppImage
          if-no-files-found: error
          retention-days: 30

      # Upload .deb for Debian/Ubuntu users
      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Stack-Stream-Deck-linux-x64.deb
          path: dist-electron/*.deb
          if-no-files-found: error
          retention-days: 30
